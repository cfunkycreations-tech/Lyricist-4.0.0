<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the app can paint under the iPhone notch and the
         Android gesture bar once it is installed and running full screen. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Lyricist 4.2.0</title>

    <!-- PWA. These are inert inside Electron, which loads this file from
         file:// and ignores all of it. They only matter on the web build. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#04060f" />
    <meta name="description" content="A free songwriting studio. Write, shape, forge full songs, loop live, master albums, and turn finished lyrics into real music." />

    <!-- iOS has never supported the manifest properly, so Safari needs its own
         set of tags to install to the home screen and open without browser
         chrome. Without apple-mobile-web-app-capable it opens in Safari. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lyricist" />
    <link rel="apple-touch-icon" href="./pwa/apple-touch-icon.png" />
    <link rel="icon" href="./pwa/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
