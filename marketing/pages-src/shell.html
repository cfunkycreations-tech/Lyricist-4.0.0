<style>
@font-face { font-family: "Audiowide BH"; src: url(data:font/woff2;base64,{{FONT}}) format("woff2"); font-display: swap; }

/* Store pages (About, FAQ, Get started). Same look as the store home page:
   near-black, warm orange light, Audiowide for display. Every class is
   bh- prefixed, because Gumroad's own Tailwind sits on the same page and
   took out the home page's ".ring" once already. */
:root {
  --bh-bg: #06030a; --bh-bg2: #0e0713; --bh-panel: #140b19; --bh-line: #2b1c2e;
  --bh-ink: #fbf1e6; --bh-ink2: #cbb8a8; --bh-ink3: #8f7c71;
  --bh-hot: #ff8a3d; --bh-hot2: #ffb25a; --bh-mint: #39d98a;
  --bh-glow: rgba(255, 138, 61, .30);
  --bh-display: "Audiowide BH", "Bahnschrift", "Segoe UI", system-ui, sans-serif;
  --bh-body: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --bh-mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bh-bg: #f4f1f6; --bh-bg2: #ece6f0; --bh-panel: #ffffff; --bh-line: #ddd3e2;
    --bh-ink: #170d1d; --bh-ink2: #4a3d52; --bh-ink3: #6e6175;
    --bh-hot: #c2410c; --bh-hot2: #9a3412; --bh-mint: #0f8a53;
    --bh-glow: rgba(194, 65, 12, .18);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bh-bg: #f4f1f6; --bh-bg2: #ece6f0; --bh-panel: #ffffff; --bh-line: #ddd3e2;
  --bh-ink: #170d1d; --bh-ink2: #4a3d52; --bh-ink3: #6e6175;
  --bh-hot: #c2410c; --bh-hot2: #9a3412; --bh-mint: #0f8a53;
  --bh-glow: rgba(194, 65, 12, .18);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bh-bg); color: var(--bh-ink); font: 16px/1.65 var(--bh-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
img { max-width: 100%; height: auto; display: block; }
a { color: inherit; }
.bh-wrap { width: 100%; max-width: 980px; margin: 0 auto; padding-inline: 20px; }
.bh-page h1, .bh-page h2, .bh-page h3 { font-family: var(--bh-display); font-weight: 400; line-height: 1.08; margin: 0; text-wrap: balance; }
.bh-page p { margin: 0; }
.bh-eyebrow { font: 700 12px/1 var(--bh-body); letter-spacing: .22em; text-transform: uppercase; color: var(--bh-hot); }
:focus-visible { outline: 3px solid var(--bh-hot2); outline-offset: 3px; border-radius: 6px; }

.bh-btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 22px; border-radius: 999px; text-decoration: none;
  font: 400 14px/1 var(--bh-display); letter-spacing: .06em; text-transform: uppercase; transition: transform .15s ease, filter .2s; }
.bh-btn-hot { background: linear-gradient(180deg, #ffa060, #ff7a26); color: #1a0b02; box-shadow: 0 0 0 1px rgba(255,255,255,.18) inset, 0 12px 30px -10px var(--bh-glow); }
.bh-btn-hot:hover { transform: translateY(-2px); filter: brightness(1.06); }
.bh-btn-hot .bh-price { font: 700 14px/1 var(--bh-body); letter-spacing: 0; background: rgba(26,11,2,.14); padding: 6px 9px; border-radius: 999px; }
.bh-btn-line { color: var(--bh-ink); box-shadow: 0 0 0 1px var(--bh-line) inset; }
.bh-btn-line:hover { box-shadow: 0 0 0 1px var(--bh-hot) inset; }

/* Nav */
.bh-nav { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bh-bg) 86%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--bh-line); }
.bh-nav .bh-wrap { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding-block: 10px; flex-wrap: wrap; }
.bh-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font: 400 16px/1 var(--bh-display); letter-spacing: .03em; }
.bh-brand img { width: 32px; }
.bh-links { display: flex; align-items: center; gap: 18px; font-size: 14px; flex-wrap: wrap; }
.bh-links a { text-decoration: none; color: var(--bh-ink2); }
.bh-links a:hover, .bh-links a[aria-current="page"] { color: var(--bh-ink); }
.bh-links a[aria-current="page"] { box-shadow: 0 2px 0 var(--bh-hot); }
.bh-links a.bh-btn { padding: 10px 15px; font-size: 12px; color: #1a0b02; box-shadow: 0 0 0 1px rgba(255,255,255,.18) inset; }

/* Page head */
.bh-head { position: relative; overflow: hidden; padding-block: clamp(44px, 7vw, 88px) clamp(28px, 4vw, 44px); }
.bh-head::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(1.5px 1.5px at 10% 22%, var(--bh-ink3) 50%, transparent 51%),
    radial-gradient(1px 1px at 34% 80%, var(--bh-ink3) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 78% 16%, var(--bh-ink3) 50%, transparent 51%),
    radial-gradient(1px 1px at 92% 70%, var(--bh-ink3) 50%, transparent 51%),
    radial-gradient(60% 90% at 50% 0%, var(--bh-glow), transparent 70%); }
.bh-head .bh-wrap { position: relative; display: grid; gap: 14px; }
.bh-head h1 { font-size: clamp(34px, 5.6vw, 60px); }
.bh-head .bh-lede { color: var(--bh-ink2); font-size: clamp(16px, 1.7vw, 19px); max-width: 60ch; }

.bh-main { padding-block: 8px 72px; }
.bh-sect { display: grid; gap: 14px; padding-block: 26px; border-top: 1px solid var(--bh-line); }
.bh-sect:first-child { border-top: 0; }
.bh-sect h2 { font-size: clamp(22px, 2.8vw, 30px); }

/* CTA band at the foot of every page */
.bh-cta { margin-top: 36px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 22px; align-items: center; padding: 22px; border-radius: 20px;
  background: radial-gradient(120% 160% at 0% 0%, var(--bh-glow), transparent 60%), var(--bh-panel); box-shadow: 0 0 0 1px var(--bh-line) inset; }
.bh-cta img { width: 74px; }
.bh-cta h3 { font-size: 22px; }
.bh-cta p { color: var(--bh-ink2); font-size: 15px; }
@media (max-width: 640px) { .bh-cta { grid-template-columns: minmax(0, 1fr); text-align: left; } .bh-cta img { width: 58px; } }

.bh-foot { border-top: 1px solid var(--bh-line); color: var(--bh-ink3); font-size: 13px; }
.bh-foot .bh-wrap { display: flex; flex-wrap: wrap; gap: 8px 22px; justify-content: space-between; padding-block: 22px; }
.bh-foot nav { display: flex; gap: 16px; flex-wrap: wrap; }
.bh-foot a { color: var(--bh-ink2); text-decoration: none; }
.bh-foot a:hover { color: var(--bh-ink); }
.bh-mail { font-family: var(--bh-mono); color: var(--bh-ink); user-select: all; }

/* About */
.bh-about { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: clamp(26px, 5vw, 60px); align-items: center; }
.bh-orbit { position: relative; width: min(360px, 100%); aspect-ratio: 1; margin-inline: auto; }
.bh-orbit .bh-spin { position: absolute; inset: -5%; border-radius: 50%;
  background: conic-gradient(from 0deg, transparent 0 8%, #ff7a26 16%, #ffd29a 22%, #ff8a3d 30%, transparent 42% 55%, #a77bff 64%, #ff6a1a 72%, #ffc078 78%, transparent 90%);
  -webkit-mask: radial-gradient(circle, transparent 0 62%, #000 64% 70%, transparent 74%); mask: radial-gradient(circle, transparent 0 62%, #000 64% 70%, transparent 74%);
  filter: blur(3px); animation: bh-spin 12s linear infinite; }
.bh-orbit .bh-photo { position: absolute; inset: 9%; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 2px rgba(255,214,170,.85), 0 0 34px 6px rgba(255,140,60,.5), 0 0 100px 26px rgba(255,110,40,.22); }
.bh-orbit .bh-photo img { width: 100%; height: 100%; object-fit: cover; }
@keyframes bh-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .bh-orbit .bh-spin { animation: none; } }
.bh-story { display: grid; gap: 16px; font-size: clamp(16px, 1.6vw, 18px); color: var(--bh-ink2); max-width: 60ch; }
.bh-story strong, .bh-story h1 { color: var(--bh-ink); font-weight: 600; }
.bh-story h1 { font-weight: 400; font-size: clamp(32px, 4.6vw, 54px); }
.bh-sig { font: 400 18px/1.2 var(--bh-display); color: var(--bh-hot); letter-spacing: .02em; }
.bh-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.bh-fact { padding: 16px; border-radius: 14px; background: var(--bh-panel); box-shadow: 0 0 0 1px var(--bh-line) inset; display: grid; gap: 4px; }
.bh-fact b { font: 400 24px/1.1 var(--bh-display); color: var(--bh-hot); font-variant-numeric: tabular-nums; }
.bh-fact span { color: var(--bh-ink2); font-size: 14px; }
@media (max-width: 760px) { .bh-about { grid-template-columns: minmax(0, 1fr); } .bh-orbit { width: min(260px, 80%); } .bh-facts { grid-template-columns: minmax(0, 1fr); } }

/* FAQ */
.bh-faq { display: grid; gap: 10px; }
.bh-faq details { border-radius: 14px; background: var(--bh-panel); box-shadow: 0 0 0 1px var(--bh-line) inset; }
.bh-faq summary { cursor: pointer; list-style: none; padding: 16px 48px 16px 18px; position: relative; font-weight: 600; font-size: 16px; }
.bh-faq summary::-webkit-details-marker { display: none; }
.bh-faq summary::after { content: "+"; position: absolute; right: 18px; top: 50%; transform: translateY(-50%); font: 400 22px/1 var(--bh-display); color: var(--bh-hot); transition: transform .2s; }
.bh-faq details[open] summary::after { transform: translateY(-50%) rotate(45deg); }
.bh-faq details > div { padding: 0 18px 18px; color: var(--bh-ink2); display: grid; gap: 10px; max-width: 70ch; }
.bh-faq ul { margin: 0; padding-left: 20px; }

/* Get started */
.bh-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; counter-reset: bh-step; }
.bh-steps > li { counter-increment: bh-step; display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 18px; padding: 20px; border-radius: 18px; background: var(--bh-panel); box-shadow: 0 0 0 1px var(--bh-line) inset; }
.bh-steps > li::before { content: counter(bh-step, decimal-leading-zero); font: 400 34px/1 var(--bh-display); color: var(--bh-hot); text-shadow: 0 0 22px var(--bh-glow); }
.bh-steps h2 { font-size: clamp(20px, 2.4vw, 24px); margin-bottom: 8px !important; }
.bh-steps p, .bh-steps li li { color: var(--bh-ink2); }
.bh-steps .bh-body { display: grid; gap: 10px; }
.bh-keys { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bh-key { font: 600 13px/1 var(--bh-body); padding: 8px 11px; border-radius: 8px; background: var(--bh-bg2); box-shadow: 0 0 0 1px var(--bh-line) inset, 0 2px 0 var(--bh-line); color: var(--bh-ink); }
.bh-arrow { color: var(--bh-ink3); }
.bh-keys .bh-note { flex-basis: 100%; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
.bh-note { font-size: 14px; color: var(--bh-ink3); }
.bh-url { font-family: var(--bh-mono); color: var(--bh-ink); background: var(--bh-bg2); padding: 2px 7px; border-radius: 6px; user-select: all; overflow-wrap: anywhere; }
.bh-steps li.bh-opt { background: transparent; box-shadow: none; border: 1.5px dashed var(--bh-line); }
.bh-steps li.bh-opt::before { content: "+"; color: var(--bh-ink3); text-shadow: none; }
@media (max-width: 560px) { .bh-steps > li { grid-template-columns: minmax(0, 1fr); gap: 8px; } }
</style>

<div class="bh-page">
<header class="bh-nav">
  <div class="bh-wrap">
    <a class="bh-brand" href="{{HOME}}"><img src="{{LOGO_SM}}" alt="" width="32" height="35">CFunky Creations</a>
    <nav class="bh-links" aria-label="Store">
      <a href="{{HOME}}/about"{{CUR_about}}>About</a>
      <a href="{{HOME}}/faq"{{CUR_faq}}>FAQ</a>
      <a href="{{HOME}}/start"{{CUR_start}}>Get started</a>
      <a class="bh-btn bh-btn-hot" href="{{LP_URL}}">Get Lyricist Pro</a>
    </nav>
  </div>
</header>

{{BODY}}

<footer class="bh-foot">
  <div class="bh-wrap">
    <span>CFunky Creations · Austin, Texas</span>
    <nav aria-label="More">
      <a href="{{HOME}}">Store</a>
      <a href="{{LP_URL}}">Lyricist Pro</a>
      <a href="{{HOME}}/about">About</a>
      <a href="{{HOME}}/faq">FAQ</a>
      <a href="{{HOME}}/start">Get started</a>
    </nav>
    <span>Help: <span class="bh-mail">cfunkycreations@gmail.com</span></span>
  </div>
</footer>
</div>
