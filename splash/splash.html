<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Lyricist</title>
<style>
  /* The splash window is frameless and transparent, so this page IS the shape
     the user sees. Nothing may overflow the video or a grey rectangle appears
     around it. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    /* Whole splash is click-to-skip, so show a hand over all of it. */
    cursor: pointer;
    user-select: none;
  }
  #wrap {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    overflow: hidden;
    background: #07050f;
    box-shadow: 0 0 0 1px rgba(168, 85, 247, 0.45), 0 18px 60px rgba(0, 0, 0, 0.7);
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  /* A quiet line so a slow first boot does not read as a hung window. It sits
     over the clip rather than adding height, so the window stays exactly the
     video's shape. */
  #skip {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 12px;
    text-align: center;
    font: 600 11px/1 'Segoe UI', system-ui, sans-serif;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(233, 213, 255, 0.75);
    text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="wrap">
    <!-- The file itself has no audio track at all, by his rule that no video in
         this app makes noise. The only sound the splash can make is a voice-over
         he recorded himself, handed in as ?voice= by main.js. -->
    <video id="clip" src="./splash.mp4" autoplay muted playsinline></video>
    <div id="skip">Starting Lyricist 4.2.0</div>
  </div>
  <script>
    const clip = document.getElementById('clip');

    // Optional voice-over, if one was ever dropped into the voice folder. It
    // plays for however long the splash happens to be up and is cut off when
    // the app is ready — the app NEVER waits for it. Holding the window back
    // for a 25-second clip is what made Lyricist look like it launched to
    // nothing.
    const voiceUrl = new URLSearchParams(location.search).get('voice');
    let voice = null;
    if (voiceUrl) {
      voice = new Audio(voiceUrl);
      voice.play().catch(() => { /* no voice is not a failure */ });
    }

    clip.play().catch(() => { /* a still first frame is fine */ });

    // Click to swat it off the screen early. The main window is already loading
    // behind this, so dismissing it never cancels anything.
    addEventListener('click', () => {
      try { voice?.pause(); } catch {}
      try { window.splash?.done('clicked'); } catch { /* main closes us anyway */ }
    });
  </script>
</body>
</html>
