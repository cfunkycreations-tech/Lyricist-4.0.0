<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Lyricist</title>
<style>
  /* The splash window is frameless and transparent, so this page IS the shape
     the user sees. Nothing may overflow the video or a grey rectangle appears
     around it. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    /* Whole splash is click-to-skip, so show a hand over all of it. */
    cursor: pointer;
    user-select: none;
  }
  #wrap {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    overflow: hidden;
    background: #07050f;
    box-shadow: 0 0 0 1px rgba(168, 85, 247, 0.45), 0 18px 60px rgba(0, 0, 0, 0.7);
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  /* Says what clicking does, because the opener now runs its full length and a
     person who wants straight into the app must be able to see the way past it.
     It sits over the clip rather than adding height, so the window stays
     exactly the video's shape. */
  #skip {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 12px;
    text-align: center;
    font: 600 11px/1 'Segoe UI', system-ui, sans-serif;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(233, 213, 255, 0.75);
    text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="wrap">
    <!-- The file itself has no audio track at all, by his rule that no video in
         this app makes noise. The only sound the splash can make is a voice-over
         he recorded himself, handed in as ?voice= by main.js. -->
    <video id="clip" src="./splash.mp4" autoplay muted playsinline></video>
    <div id="skip">Click to skip</div>
  </div>
  <script>
    const clip = document.getElementById('clip');
    const skip = document.getElementById('skip');

    // Told main once, no matter which of these fires first.
    let reported = false;
    const finish = (why) => {
      if (reported) return;
      reported = true;
      try { window.splash?.done(why); } catch { /* main closes us anyway */ }
    };

    // His own recording, played as a separate track alongside the silent video.
    const voiceUrl = new URLSearchParams(location.search).get('voice');
    let voice = null;
    if (voiceUrl) {
      voice = new Audio(voiceUrl);
      voice.play().catch(() => { /* no voice is not a failure */ });
    }

    clip.play().catch(() => {
      // Autoplay refused before the window has focus. A still first frame is
      // fine to look at, but nothing will fire 'ended', so don't make the app
      // wait on a clip that is never going to run.
      finish('clip would not autoplay');
    });

    // The opener plays out. If a voice-over is longer than the video, wait for
    // the voice — cutting his own recording off mid-word is the one thing this
    // whole change exists to prevent.
    clip.addEventListener('ended', () => {
      if (voice && !voice.ended && !voice.paused) {
        voice.addEventListener('ended', () => finish('voice ended'), { once: true });
        return;
      }
      finish('clip ended');
    });
    clip.addEventListener('error', () => finish('clip error'));

    // Click anywhere to get past it. The main window is already loading behind
    // this, so skipping early never cancels anything.
    addEventListener('click', () => {
      try { voice?.pause(); } catch {}
      skip.textContent = 'Starting Lyricist 4.2.0';
      finish('clicked');
    });
  </script>
</body>
</html>
