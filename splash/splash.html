<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Lyricist</title>
<style>
  /* The splash window is frameless and transparent, so this page IS the shape
     the user sees. Nothing may overflow the video or a grey rectangle appears
     around it. */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    /* Whole splash is click-to-dismiss, so show a hand over all of it. */
    cursor: pointer;
    user-select: none;
  }
  #wrap {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    overflow: hidden;
    background: #07050f;
    box-shadow: 0 0 0 1px rgba(168, 85, 247, 0.45), 0 18px 60px rgba(0, 0, 0, 0.7);
  }
  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  /* A quiet line so a slow first boot does not read as a hung window. It sits
     over the clip rather than adding height, so the window stays exactly the
     video's shape. */
  #status {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 12px;
    text-align: center;
    font: 600 11px/1 'Segoe UI', system-ui, sans-serif;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(233, 213, 255, 0.75);
    text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="wrap">
    <!-- Muted on purpose: every video this app plays by itself is silent, and a
         splash that makes noise on launch is the first thing people would want
         turned off. `playsinline` and the play() retry cover the case where
         autoplay is refused before the window has focus. -->
    <video id="clip" src="./splash.mp4" autoplay muted playsinline></video>
    <div id="status">Starting Lyricist 4.2.0</div>
  </div>
  <script>
    const clip = document.getElementById('clip');
    clip.play().catch(() => { /* a still first frame is fine */ });
    // Click anywhere to get rid of it. The main window is already loading
    // behind this, so dismissing early never cancels anything.
    addEventListener('click', () => window.close());
  </script>
</body>
</html>
